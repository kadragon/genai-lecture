<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2b52e8"/>
      <stop offset="100%" stop-color="#1837ad"/>
    </linearGradient>
    <linearGradient id="sparkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#edf2ff"/>
    </linearGradient>
  </defs>

  <!-- Squircle Base -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <rect width="30" height="30" x="1" y="1" rx="6" fill="none" stroke="rgba(255, 255, 255, 0.22)" stroke-width="1"/>

  <!-- Synapse Lines -->
  <!-- Layer 1 to Layer 2 -->
  <line x1="6.5" y1="8" x2="12.5" y2="12" stroke="rgba(255,255,255,0.48)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6.5" y1="16" x2="12.5" y2="12" stroke="rgba(255,255,255,0.48)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6.5" y1="16" x2="12.5" y2="20" stroke="rgba(255,255,255,0.48)" stroke-width="1.4" stroke-linecap="round"/>
  <line x1="6.5" y1="24" x2="12.5" y2="20" stroke="rgba(255,255,255,0.48)" stroke-width="1.4" stroke-linecap="round"/>

  <!-- Layer 2 to Spark (Emergence connection) -->
  <line x1="12.5" y1="12" x2="17.5" y2="15" stroke="rgba(255,255,255,0.38)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 1.5"/>
  <line x1="12.5" y1="20" x2="17.5" y2="17" stroke="rgba(255,255,255,0.38)" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="1 1.5"/>

  <!-- Layer 1 Nodes (Input: Data / MNIST) -->
  <circle cx="6.5" cy="8" r="1.8" fill="#a5c2ff"/>
  <circle cx="6.5" cy="16" r="1.8" fill="#a5c2ff"/>
  <circle cx="6.5" cy="24" r="1.8" fill="#a5c2ff"/>

  <!-- Layer 2 Nodes (Hidden: Weights / Thought) -->
  <circle cx="12.5" cy="12" r="2.1" fill="#d2e1ff"/>
  <circle cx="12.5" cy="20" r="2.1" fill="#d2e1ff"/>

  <!-- Output: Generative AI Sparkle -->
  <path d="M 22 5.5 C 22 12 23.6 14.6 28.5 16 C 23.6 17.4 22 20 22 26.5 C 22 20 20.4 17.4 15.5 16 C 20.4 14.6 22 12 22 5.5 Z"
        fill="url(#sparkGrad)"/>
  <!-- Sub Spark / Intelligence glint -->
  <circle cx="27" cy="7" r="1.2" fill="#ffffff" opacity="0.9"/>
</svg>